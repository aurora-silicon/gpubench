# rtbench presets. Each [section] is a preset; keys are the long CLI flags without "--".
# Flags given on the command line after --preset override these values.
# Both executors (Vulkan and Metal) embed this file at build time; --preset-file reads another copy.

[raster]
# Baseline without rays: same scene as "medium", nothing reflects, no shadow rays.
res=1920x1080
mesh-tris=20000
meshes=10
instances=256
water-tris=32768
blas=static
tlas=static
reflective=0
rpp=1
bounces=1
shadows=0
tmax=400
alpha=1

[light]
res=1280x720
mesh-tris=4000
meshes=6
instances=64
water-tris=8192
blas=static
tlas=static
reflective=0.3
rpp=1
bounces=1
shadows=0
tmax=200
alpha=0

[medium]
res=1920x1080
mesh-tris=20000
meshes=10
instances=256
water-tris=32768
blas=refit
dyn-patches=4
tlas=rebuild
moving=0.1
reflective=0.5
rpp=1
bounces=1
shadows=1
tmax=400
alpha=1

[solarbay]
# Closest to the 3DMark Solar Bay workload: 1440p, reflections only (one bounce, one ray per
# reflective pixel), alpha-tested geometry, animated water and moving objects.
res=2560x1440
mesh-tris=24000
meshes=12
instances=384
water-tris=65536
blas=refit
dyn-patches=8
tlas=rebuild
moving=0.2
reflective=0.6
rpp=1
bounces=1
shadows=0
tmax=400
alpha=1

[heavy]
res=1920x1080
mesh-tris=30000
meshes=16
instances=512
water-tris=131072
blas=refit
dyn-patches=16
tlas=rebuild
moving=0.25
reflective=0.7
rpp=2
bounces=2
shadows=1
tmax=400
alpha=1

[extreme]
res=2560x1440
mesh-tris=60000
meshes=24
instances=512
water-tris=262144
blas=rebuild
dyn-patches=16
tlas=rebuild
moving=0.5
reflective=1.0
rpp=4
bounces=3
shadows=1
tmax=1000
alpha=1
